<!DOCTYPE html>
<html>
<head>
  <title>Email Classifier</title>
  <style>
    body { font-family: Arial; padding: 10px; width: 300px; }
    textarea { width: 100%; height: 100px; }
    button { margin-top: 10px; }
  </style>
</head>
<body>
  <h3>Email Classifier</h3>
  <button id="fetchEmailBtn">Fetch Last Email</button>
  <div id="emailDetails" style="margin-top: 10px;">
    <strong>From:</strong> <span id="fromEmail"></span><br>
    <strong>Subject:</strong> <span id="subjectEmail"></span><br>
    <strong>Body:</strong> <span id="bodyEmail"></span>
  </div>
  <p id="result" style="font-weight: bold; margin-top: 10px;"></p>

  <script src="popup.js"></script>
</body>
</html>
